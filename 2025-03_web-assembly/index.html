<html class="h-full bg-slate-900">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.3/full/pyodide.js"></script>
    <script>
      async function main() {
        let pyodide = await loadPyodide({
          indexURL : "https://cdn.jsdelivr.net/pyodide/v0.23.7/full/"
        });
        console.log(pyodide.runPython("print('Hello, world from the browser!')"));
      };
      main();
    </script>
  </head>
</html>
